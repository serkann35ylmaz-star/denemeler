<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Megalodon Storyboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:"Fraunces";font-weight:900;src:url(fonts/fraunces-latin-900-normal.woff2) format("woff2");unicode-range:U+0000-00FF}
@font-face{font-family:"Fraunces";font-weight:600;src:url(fonts/fraunces-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF}
@font-face{font-family:"Fraunces";font-weight:600;src:url(fonts/fraunces-latin-ext-600-normal.woff2) format("woff2");unicode-range:U+0100-024F}
@font-face{font-family:"Fraunces";font-weight:900;src:url(fonts/fraunces-latin-ext-900-normal.woff2) format("woff2");unicode-range:U+0100-024F}
@font-face{font-family:"Work Sans";font-weight:500;src:url(fonts/work-sans-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF}
@font-face{font-family:"Work Sans";font-weight:500;src:url(fonts/work-sans-latin-ext-500-normal.woff2) format("woff2");unicode-range:U+0100-024F}
@font-face{font-family:"Work Sans";font-weight:700;src:url(fonts/work-sans-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF}
@font-face{font-family:"Work Sans";font-weight:700;src:url(fonts/work-sans-latin-ext-700-normal.woff2) format("woff2");unicode-range:U+0100-024F}
body{margin:0;background:#2b3439;color:#F3EBDD;font:16px "Work Sans",sans-serif}
.sheet{display:flex;gap:18px;padding:24px;flex-wrap:wrap}
figure{margin:0;cursor:pointer}figcaption{margin-top:6px;font-weight:700}
canvas.th{width:216px;height:384px;display:block;border-radius:6px}
#big{display:block;margin:0 24px 24px;width:min(540px,90vw);aspect-ratio:9/16;border-radius:8px}
</style></head><body>
<div class="sheet" id="sheet"></div><canvas id="big" width="1080" height="1920"></canvas>
<script src="paper.js"></script><script src="art.js"></script><script src="scenes.js"></script>
<script>
const KEY=[[1,12.2],[2,13.5],[3,14.0],[4,16.0],[5,14.5]];
window.seek=t=>Scenes.drawFrame(document.getElementById('big').getContext('2d'),t);
function thumb(i,t){const c=document.createElement('canvas');c.className='th';c.width=360;c.height=640;const g=c.getContext('2d');g.scale(1/3,1/3);Scenes.drawFrame(g,t);return c}
document.fonts.load('900 40px Fraunces').then(()=>Promise.all(['600 40px Fraunces','500 40px "Work Sans"','700 40px "Work Sans"','900 40px Fraunces'].map(f=>document.fonts.load(f,'ğışçöüİ')))).then(()=>{
  const sh=document.getElementById('sheet');
  KEY.forEach(([n,lt])=>{const s=Scenes.SCENES[n-1],t=s.start+lt,f=document.createElement('figure');f.appendChild(thumb(n,t));const cap=document.createElement('figcaption');cap.textContent='Sahne '+n+' · '+t.toFixed(1)+' sn';f.appendChild(cap);f.onclick=()=>seek(t);sh.appendChild(f)});
  seek(Scenes.SCENES[0].start+KEY[0][1]); window.READY=true;});
</script></body></html>
